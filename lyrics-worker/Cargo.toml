[package]
name = "fastcloud-lyrics-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.27"
unicode-normalization = "0.1.25"
parking_lot = "0.12"
url = "2"
