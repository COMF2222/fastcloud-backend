server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://@IP@$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/@IP@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@IP@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $fastcloud_upstream fastcloud:8080;
        proxy_pass http://$fastcloud_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    location ^~ /v1/media/ {
        access_log off;
        set $fastcloud_upstream fastcloud:8080;
        proxy_pass http://$fastcloud_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }
}
